			<p>Firewall reload finished.</p>
		</div>

		<div class="cbi-map">
			<h2>Processes</h2>
			<div class="cbi-section">
				<div class="table">
					<div class="tr table-titles">
						<div class="th">PID</div>
						<div class="th">Owner</div>
						<div class="th">Command</div>
						<div class="th">CPU</div>
						<div class="th"></div>
					</div>
					<div class="tr">
						<div class="td">1</div>
						<div class="td">root</div>
						<div class="td">/sbin/procd</div>
						<div class="td">0%</div>
						<div class="td"><button class="cbi-button cbi-button-remove" type="button">Hang Up</button></div>
					</div>
					<div class="tr">
						<div class="td">812</div>
						<div class="td">root</div>
						<div class="td">/usr/sbin/uhttpd</div>
						<div class="td">1%</div>
						<div class="td"><button class="cbi-button cbi-button-remove" type="button">Hang Up</button></div>
					</div>
					<div class="tr">
						<div class="td">940</div>
						<div class="td">root</div>
						<div class="td">/usr/sbin/hostapd</div>
						<div class="td">0%</div>
