<!DOCTYPE html>
<html lang="zh-CN" data-darkmode="true">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OpenWrt</title>
	<link rel="stylesheet" href="../htdocs/luci-static/afury/cascade.css">
	<link rel="stylesheet" href="../htdocs/luci-static/afury/tokens.css">
	<link rel="stylesheet" href="../htdocs/luci-static/afury/skin.css">
	<link rel="stylesheet" media="only screen and (max-width: 854px)" href="../htdocs/luci-static/afury/mobile.css">
	<link rel="icon" href="../htdocs/luci-static/afury/favicon.svg" type="image/svg+xml">
</head>
<body class="modal-overlay-active" data-page="sysauth">
	<div id="modal_overlay">
		<div class="modal login">
			<div class="login-head">
				<div class="login-brand">
					<svg class="brand-logo" viewBox="0 0 112 36" fill="none" role="img" aria-label="Afury" width="112" height="36">
						<title>Afury</title>
						<g fill="currentColor">
							<path fill-rule="evenodd" d="M14.8 2.5 1 26h4.2l2.35-5.6h10.9L20.8 26h4.2L14.8 2.5Zm0 6.2 3.85 9.15h-7.7L14.8 8.7Z"/>
							<path d="M32.4 26V9c0-3.7 2.15-5.95 5.9-5.95H45.6V5.8h-6.55c-1.9 0-3.05 1.15-3.05 3.35v4.05h7.35v2.45H36V26h-3.6Z"/>
							<path d="M49.2 11.45h3.25v8.2c0 2.75 1.3 4.35 3.95 4.35s3.95-1.6 3.95-4.35v-8.2h3.25v8.35c0 4.55-2.7 7.2-7.2 7.2s-7.2-2.65-7.2-7.2v-8.35Z"/>
							<path d="M70.2 11.45h3.25v1.95c.95-1.45 2.3-2.2 4.05-2.2v3.05c-.28-.05-.58-.08-.88-.08-1.9 0-3.17 1.2-3.17 3.55V26H70.2V11.45Z"/>
							<path d="M85.15 11.45h3.4l4.75 8.15 4.75-8.15h3.45L95.3 22.4V33.6h-3.3V22.4l-6.85-10.95Z"/>
						</g>
						<rect fill="#0496D4" x="8.2" y="15.55" width="13.2" height="3.15" rx="1.55"/>
					</svg>
				</div>
				<button type="button" class="rect-mode-toggle" data-rect-dark="1" aria-label="切换为浅色">
					<svg class="rect-mode-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a6.2 6.2 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
					<svg class="rect-mode-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
				</button>
			</div>
			<form class="cbi-map" action="#" onsubmit="return false">
				<div class="cbi-section">
					<div class="cbi-section-node">
						<div class="cbi-value">
							<label class="cbi-value-title" for="luci_username">用户名</label>
							<div class="cbi-value-field">
								<input id="luci_username" name="luci_username" type="text" value="root" autocomplete="username">
							</div>
						</div>
						<div class="cbi-value">
							<label class="cbi-value-title" for="luci_password">密码</label>
							<div class="cbi-value-field">
								<input id="luci_password" name="luci_password" type="password" autocomplete="current-password">
							</div>
						</div>
					</div>
				</div>
				<button class="btn cbi-button-positive important" type="submit">登录</button>
			</form>
		</div>
	</div>
	<script src="preview.js"></script>
</body>
</html>
